<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro Anime Cat</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #3a3f9e, #2a2f7a);
            font-family: Arial, sans-serif;
            color: white;
        }

        .card {
            background: #4f5db8;
            padding: 30px;
            border-radius: 25px;
            width: 320px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .cat-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 15px 0;
            border: 3px solid #c8b6ff;
        }

        .label {
            margin-top: 10px;
            font-size: 16px;
        }

        #timer {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
        }

        button {
            background: #c8b6ff;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b39ddb;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Pomodoro Anime Cat</h1>

    <!-- IMAGEN -->
    <img src="5656.jfif" alt="Anime Cat" class="cat-img">

    <p class="label">Tiempo de trabajo</p>
    <div id="timer">25:00</div>

    <button onclick="startTimer()">Iniciar</button>
</div>

<script>
    let time = 25 * 60;
    let interval;

    function startTimer() {
        if (interval) return;

        interval = setInterval(() => {
            let minutes = Math.floor(time / 60);
            let seconds = time % 60;

            document.getElementById("timer").innerText =
                `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;

            time--;

            if (time < 0) {
                clearInterval(interval);
                interval = null;
                alert("¡Tiempo terminado!");
            }
        }, 1000);
    }
</script>

</body>
</html>
